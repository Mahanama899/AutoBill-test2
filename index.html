<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Billing</title>

    <link rel="stylesheet" href="asset/css/style.css">

    <!-- Libraries (ORDER IS IMPORTANT) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <!-- Your Script -->
    <script src="asset/scripts/script.js"></script>
</head>

<body>

<!-- FULLSCREEN BUTTON -->
<button id="fsBtn" onclick="goFullScreen()"
    style="
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 9999;
        padding: 10px 15px;
        font-size: 14px;
        background: #02c8db;
        color: white;
        border: none;
        border-radius: 6px;
    ">
    FULL SCREEN
</button>

<!-- START ANIMATION -->
<div class="lottie" id="1">
    <lottie-player src="https://assets1.lottiefiles.com/packages/lf20_jioazy9u.json"
        background="transparent" speed="1" loop autoplay>
    </lottie-player>
    <div class="text">PLACE ITEMS TO START CHECKOUT</div>
</div>

<!-- MAIN CONTENT -->
<main id="home"></main>

<!-- CHECKOUT BUTTON -->
<div id="final">
    <button id="2" class="checkout" onclick="checkout()">CHECKOUT</button>
</div>

<!-- QR CODE -->
<div id="qr" class="animated fadeInUp Once">
    <h3>Scan QR Code To Pay</h3>
    <img id="image" src="" />
</div>

<!-- SUCCESS -->
<div id="success">
    <lottie-player src="https://assets7.lottiefiles.com/private_files/lf30_poez9ped.json"
        background="transparent" speed="1"
        style="width: 300px; height: 300px;"
        loop autoplay>
    </lottie-player>
</div>

</body>
</html>
