<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Billing</title>

    <link rel="stylesheet" href="asset/css/style.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="asset/scripts/script.js"></script>
</head>

<body>

<button onclick="goFullScreen()" style="position:fixed;top:10px;right:10px;z-index:9999;">
    FULL SCREEN
</button>

<!-- START SCREEN -->
<div class="lottie" id="startScreen">
    <div class="text">PLACE ITEMS TO START CHECKOUT</div>
</div>

<!-- PRODUCT LIST -->
<main id="home" style="display:none;"></main>

<!-- CHECKOUT BUTTON -->
<div id="final" style="display:none;">
    <button id="checkoutBtn" class="checkout" onclick="checkout()">CHECKOUT</button>
</div>

<!-- QR SCREEN -->
<div id="qr" style="display:none;text-align:center;">
    <p>Scan QR Code To Pay</p>
    <img id="image" src="" />
</div>

<!-- SUCCESS -->
<div id="success" style="display:none;text-align:center;">
    <h2>Payment Successful</h2>
</div>

</body>
</html>
