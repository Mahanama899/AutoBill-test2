<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Billing</title>

    <link rel="stylesheet" href="asset/css/style.css">

    <!-- Libraries FIRST -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <!-- Your Script LAST -->
    <script src="asset/scripts/script.js"></script>
</head>

<body>

<!-- FULL SCREEN BUTTON -->
<button id="fsBtn" onclick="goFullScreen()"
    style="position:fixed;top:10px;right:10px;z-index:9999;">
    FULL SCREEN
</button>

<!-- START SCREEN -->
<div class="lottie" id="1">
    <lottie-player
        src="https://assets1.lottiefiles.com/packages/lf20_jioazy9u.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
    </lottie-player>
    <div class="text">PLACE ITEMS TO START CHECKOUT</div>
</div>

<!-- PRODUCT LIST -->
<main id="home" style="display:none;"></main>

<!-- CHECKOUT BUTTON -->
<div id="final" style="display:none;">
    <button id="2" class="checkout" onclick="checkout()">CHECKOUT</button>
</div>

<!-- QR CODE -->
<div id="qr" style="display:none;">
    <h3>Scan QR Code To Pay</h3>
    <img id="image" src="">
</div>

<!-- SUCCESS -->
<div id="success" style="display:none;">
    <lottie-player
        src="https://assets7.lottiefiles.com/private_files/lf30_poez9ped.json"
        background="transparent"
        speed="1"
        style="width:300px;height:300px;"
        loop
        autoplay>
    </lottie-player>
</div>

</body>
</html>
